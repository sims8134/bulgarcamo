@keyframes trail{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dot{from{transform:translateX(-822px)}to{transform:none}}
@keyframes word{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes gg{from{opacity:0;transform:translateX(-160px)}to{opacity:.45;transform:translateX(-9px)}}
