<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 420 960 280" role="img" aria-label="Bulgarcamo"><title>BGKM · Bulgarcamo</title><defs>
<linearGradient id="tr" x1="0" x2="1"><stop offset="0" stop-color="#7dff4f" stop-opacity="0"/><stop offset=".7" stop-color="#7dff4f" stop-opacity=".75"/><stop offset="1" stop-color="#e9ffe0" stop-opacity=".95"/></linearGradient>
<linearGradient id="trg" x1="0" x2="1"><stop offset="0" stop-color="#7dff4f" stop-opacity="0"/><stop offset="1" stop-color="#7dff4f"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#e9ffe0"/><stop offset=".3" stop-color="#7dff4f"/><stop offset="1" stop-color="#7dff4f" stop-opacity="0"/></radialGradient></defs><style>
